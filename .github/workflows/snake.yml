name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MennahtullahMabrouk
          outputs: |
            github-contribution-grid-snake.svg?color_snake=%23F0ABFC&color_dots=%23181124,%232D2244,%235B4670,%23C084FC,%23F0ABFC

      - name: Commit and push snake SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git diff --staged --quiet || git commit -m "Update contribution snake animation"
          git push
