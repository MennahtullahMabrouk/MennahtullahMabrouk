name: Update Readme Data Cards

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - assets/stats-row.svg
      - assets/top-languages-mac.svg
      - assets/radar-part.svg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate data-driven SVG cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_cards.py

      - name: Commit regenerated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add assets/stats-row.svg assets/top-languages-mac.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub data cards from API"
          git pull --rebase origin main
          git push
