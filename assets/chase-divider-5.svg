<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Ghost chase divider">
  <style>
    .run { animation: travel 30s linear infinite both; animation-delay: 20s; }
    @keyframes travel {
      0%   { transform: translateX(0) translateY(0); opacity: 0; }
      2%   { opacity: 1; }
      14%  { transform: translateX(600px) translateY(-3px); opacity: 1; }
      16.5%{ transform: translateX(660px) translateY(0); opacity: 1; }
      16.7%{ opacity: 0; }
      100% { transform: translateX(660px) translateY(0); opacity: 0; }
    }
  </style>
  <rect x="0" y="0" width="850" height="60" fill="#181124" />
  <g transform="translate(70, 30)">
    <g class="run">
      <g transform="scale(1.5)">
        <g fill="#E0AAFF">
          <rect x="2" y="0" width="8" height="1" />
          <rect x="1" y="1" width="10" height="1" />
          <rect x="0" y="2" width="12" height="7" />
          <rect x="0" y="9" width="4" height="1" />
          <rect x="5" y="9" width="3" height="1" />
          <rect x="9" y="9" width="3" height="1" />
        </g>
        <g fill="#181124">
          <rect x="3" y="4" width="2" height="2" />
          <rect x="8" y="4" width="2" height="2" />
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(140, 30)">
    <g class="run">
      <g transform="scale(1.5)">
        <g fill="#E0AAFF">
          <rect x="2" y="0" width="8" height="1" />
          <rect x="1" y="1" width="10" height="1" />
          <rect x="0" y="2" width="12" height="7" />
          <rect x="0" y="9" width="4" height="1" />
          <rect x="5" y="9" width="3" height="1" />
          <rect x="9" y="9" width="3" height="1" />
        </g>
        <g fill="#181124">
          <rect x="3" y="4" width="2" height="2" />
          <rect x="8" y="4" width="2" height="2" />
        </g>
      </g>
    </g>
  </g>
</svg>
