<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Skill radar and GitHub stats">
  <rect x="0" y="0" width="850" height="360" fill="#181124" />
<defs>
