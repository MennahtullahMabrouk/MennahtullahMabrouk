<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Purple pixel sparkle divider">
  <style>
    .twinkle { animation: twinkle var(--dur, 2s) steps(2) infinite; animation-delay: var(--delay, 0s); }
    .float { animation: floaty var(--fdur, 3s) ease-in-out infinite; animation-delay: var(--fdelay, 0s); }
    .spin { transform-origin: var(--ox) var(--oy); animation: rot var(--rdur, 2.8s) linear infinite; animation-delay: var(--rdelay, 0s); }
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes rot {
      100% { transform: rotate(360deg); }
    }
  </style>
  <rect x="0" y="0" width="850" height="60" fill="#181124" />

  <g class="spin" style="--ox:140px; --oy:30px; --rdur: 2.6s; --rdelay: 0s;">
    <g class="twinkle" style="--dur: 2.1s; --delay: 0s;" fill="#F0ABFC">
      <path d="M 140 28 L 143 31 L 140 34 L 137 31 Z"/>
      <rect x="142" y="30" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="float" style="--fdur: 2.6s; --fdelay: 0.7s;">
    <g class="twinkle" style="--dur: 1.7s; --delay: 0.4s;" fill="#C084FC">
      <path d="M 425 31 L 428 34 L 425 37 L 422 34 Z"/>
      <rect x="427" y="33" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="spin" style="--ox:710px; --oy:30px; --rdur: 3.2s; --rdelay: 0.8s;">
    <g class="twinkle" style="--dur: 2.5s; --delay: 0.9s;" fill="#F0ABFC">
      <path d="M 710 28 L 713 31 L 710 34 L 707 31 Z"/>
      <rect x="712" y="30" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
