<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 60" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="Purple pixel sparkle divider">
  <style>
    .twinkle { animation: twinkle var(--dur, 2s) steps(2) infinite; animation-delay: var(--delay, 0s); }
    .float { animation: floaty var(--fdur, 3s) ease-in-out infinite; animation-delay: var(--fdelay, 0s); }
    .spin { transform-origin: var(--ox) var(--oy); animation: rot var(--rdur, 2.8s) linear infinite; animation-delay: var(--rdelay, 0s); }
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes rot {
      100% { transform: rotate(360deg); }
    }
  </style>
  <rect x="0" y="0" width="850" height="60" fill="#181124" />

  <g class="spin" style="--ox:60px; --oy:30px; --rdur: 2.6s; --rdelay: 0s;">
    <g class="twinkle" style="--dur: 2.1s; --delay: 0s;" fill="#F0ABFC">
      <path d="M 60 28 L 62 30 L 60 32 L 58 30 Z"/>
      <rect x="61" y="29" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="float" style="--fdur: 2.6s; --fdelay: 0.7s;">
    <g class="twinkle" style="--dur: 1.7s; --delay: 0.4s;" fill="#C084FC">
      <path d="M 185 32 L 188 35 L 185 38 L 182 35 Z"/>
      <rect x="187" y="34" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="spin" style="--ox:305px; --oy:31px; --rdur: 3.2s; --rdelay: 0.8s;">
    <g class="twinkle" style="--dur: 2.5s; --delay: 0.9s;" fill="#F0ABFC">
      <path d="M 305 28 L 308 31 L 305 34 L 302 31 Z"/>
      <rect x="307" y="30" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="float" style="--fdur: 2.8s; --fdelay: 0.3s;">
    <g class="twinkle" style="--dur: 1.9s; --delay: 0.6s;" fill="#A855F7">
      <path d="M 425 31 L 428 34 L 425 37 L 422 34 Z"/>
      <rect x="427" y="33" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="spin" style="--ox:545px; --oy:31px; --rdur: 2.4s; --rdelay: 0.5s;">
    <g class="twinkle" style="--dur: 2.3s; --delay: 0.2s;" fill="#F0ABFC">
      <path d="M 545 28 L 548 31 L 545 34 L 542 31 Z"/>
      <rect x="547" y="30" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="float" style="--fdur: 2.4s; --fdelay: 0.9s;">
    <g class="twinkle" style="--dur: 1.6s; --delay: 1.1s;" fill="#C084FC">
      <path d="M 665 32 L 668 35 L 665 38 L 662 35 Z"/>
      <rect x="667" y="34" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>

  <g class="spin" style="--ox:788px; --oy:32px; --rdur: 3s; --rdelay: 0.2s;">
    <g class="twinkle" style="--dur: 2.7s; --delay: 0.7s;" fill="#F0ABFC">
      <path d="M 788 29 L 791 32 L 788 35 L 785 32 Z"/>
      <rect x="790" y="31" width="1" height="1" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
